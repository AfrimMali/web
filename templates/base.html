<!DOCTYPE html>
<html lang="{{LANG}}" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_TITLE}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{DESC}}">

<meta name="theme-color" content="#FCFBF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<link rel="alternate" type="application/atom+xml" title="{{SITE_TITLE}}" href="/feed.xml">

<script>
/* Set the theme before first paint so there's no flash. Falls back to light
   with JavaScript disabled, because :root carries the light values. */
(function () {
  try {
    var saved = localStorage.getItem("theme");
    var dark = saved ? saved === "dark"
                     : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.className = dark ? "dark" : "light";
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FCFBF8; --fg:#191813; --muted:#77726A;
    --rule:#E5E1D8; --hover:#F2EFE7;
    --serif:"Newsreader",Iowan Old Style,Palatino,Georgia,serif;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  .dark{
    --bg:#141412; --fg:#E9E6DE; --muted:#8B867C;
    --rule:#2B2A26; --hover:#1D1C19;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--serif); font-weight:300;
    font-size:18px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:clamp(2.5rem,7vw,5.5rem) 1.5rem 5rem;
    transition:background-color .2s ease,color .2s ease;
  }
  .wrap{max-width:39rem;margin:0 auto}

  a{color:var(--fg);text-decoration:none}
  a:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:2px}

  /* masthead */
  .top{display:flex;align-items:baseline;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
  .top h1{
    font-family:var(--serif);font-weight:400;font-size:1.6rem;
    letter-spacing:-.01em;margin:0;
  }
  .top nav{display:flex;align-items:baseline;gap:1.15rem}
  .top nav a,.top nav button{
    font-family:var(--sans);font-size:.78rem;letter-spacing:.01em;
    color:var(--muted);text-decoration:none;
    background:none;border:0;padding:0;cursor:pointer;font-weight:400;
  }
  .top nav a:hover,.top nav button:hover{color:var(--fg)}

  /* lede + expandable about */
  .lede{margin:1.6rem 0 0;max-width:34rem}
  .more{
    font-family:var(--sans);font-size:.78rem;color:var(--muted);
    background:none;border:0;padding:0;cursor:pointer;
  }
  .more:hover{color:var(--fg)}
  .about{margin:.9rem 0 0;max-width:34rem;color:var(--muted);font-size:.95rem}
  .about[hidden]{display:none}

  /* sections */
  .stamp{
    font-family:var(--sans);font-size:.72rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);
    margin:3.5rem 0 0;
  }
  section{margin-top:2.6rem}
  section h2{
    font-family:var(--serif);font-weight:400;font-style:italic;
    font-size:1.06rem;color:var(--muted);
    margin:0 0 1.1rem;padding-bottom:.5rem;border-bottom:1px solid var(--rule);
  }
  section ul{list-style:none;margin:0;padding:0}

  .item{margin-bottom:1.45rem}
  .item:last-child{margin-bottom:0}
  .item .t{
    font-size:1.06rem;line-height:1.4;font-weight:400;
    border-bottom:1px solid transparent;transition:border-color .15s ease;
  }
  .item .t:hover{border-bottom-color:var(--fg)}
  .item .meta{
    font-family:var(--sans);font-size:.76rem;color:var(--muted);
    white-space:nowrap;
  }
  .item .why{margin:.2rem 0 0;color:var(--muted);font-size:.94rem;line-height:1.5}

  /* archive grouping */
  .month{
    font-family:var(--sans);font-size:.72rem;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);
    margin:2.8rem 0 1.1rem;padding-bottom:.5rem;border-bottom:1px solid var(--rule);
  }

  .end{
    margin-top:4rem;padding-top:1.2rem;border-top:1px solid var(--rule);
    font-family:var(--sans);font-size:.76rem;color:var(--muted);
    display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  }
  .end a{color:var(--muted)}
  .end a:hover{color:var(--fg)}

  .empty{color:var(--muted);font-style:italic;margin-top:2.5rem}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
</style>

<script type="application/ld+json">{{JSONLD}}</script>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1><a href="/">{{SITE_TITLE}}</a></h1>
    <nav>
      {{NAV}}
      <button id="theme" type="button" aria-label="Switch colour scheme">Dark</button>
    </nav>
  </header>

  {{LEDE}}

  <main>{{MAIN}}</main>

  <footer class="end">
    <span>Updated {{UPDATED}}</span>
    <span><a href="/feed.xml">Subscribe by feed</a></span>
  </footer>

</div>

<script>
(function () {
  var btn = document.getElementById("theme");
  var root = document.documentElement;
  function label() { btn.textContent = root.className === "dark" ? "Light" : "Dark"; }
  label();
  btn.addEventListener("click", function () {
    root.className = root.className === "dark" ? "light" : "dark";
    try { localStorage.setItem("theme", root.className); } catch (e) {}
    label();
  });

  var more = document.getElementById("more");
  var about = document.getElementById("about");
  if (more && about) {
    more.addEventListener("click", function () {
      var open = !about.hidden;
      about.hidden = open;
      more.textContent = open ? "More" : "Less";
      more.setAttribute("aria-expanded", String(!open));
    });
  }
})();
</script>
{{FATHOM}}
</body>
</html>
