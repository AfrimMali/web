<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal — review</title>
<style nonce="{{NONCE}}">
  /* Deliberately not the site's stylesheet. This is a tool, and it should never
     be mistaken at a glance for the page it publishes. */
  :root{
    --bg:#F0EEE6; --fg:#1F1E1D; --muted:#5E5D59; --rule:#D1CFC5;
    --bad:#8C2F2F; --flag:#8A6A1F;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1F1E1D; --fg:#F0EEE6; --muted:#B0AEA5; --rule:#3D3D3A;
           --bad:#E08C8C; --flag:#D9BC72; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    display:grid; grid-template-columns:minmax(380px,1fr) 1fr; height:100vh;
  }
  @media (max-width:900px){ body{grid-template-columns:1fr; height:auto} }

  .panel{overflow-y:auto; padding:1.5rem 1.25rem 6rem; border-right:1px solid var(--rule)}
  h1{font-size:1.05rem; margin:0 0 .2rem}
  .sub{color:var(--muted); font-size:.8rem; margin:0 0 1.25rem; word-break:break-all}

  ul{list-style:none; margin:0; padding:0}
  .row{padding:.85rem 0; border-top:1px solid var(--rule)}
  .row.no{opacity:.55}
  .row label{display:flex; gap:.6rem; align-items:flex-start; cursor:pointer}
  .row.no label{cursor:default}
  .t{font-weight:600}
  .meta{display:flex; flex-wrap:wrap; gap:.5rem; margin:.35rem 0 0 1.6rem;
        font-size:.72rem; color:var(--muted)}
  .meta span{white-space:nowrap}
  .host{font-family:ui-monospace,Consolas,monospace}
  .host b{color:var(--fg)}
  .flag{color:var(--flag); font-weight:600}
  .bad{color:var(--bad); font-weight:600}
  .why{margin:.3rem 0 0 1.6rem; color:var(--muted); font-size:.85rem}

  .bar{
    position:fixed; bottom:0; left:0; width:minmax(380px,1fr); max-width:50vw;
    display:flex; gap:.6rem; align-items:center; padding:.85rem 1.25rem;
    background:var(--bg); border-top:1px solid var(--rule); border-right:1px solid var(--rule);
  }
  @media (max-width:900px){ .bar{position:static; max-width:none; width:auto} }
  button{
    font:inherit; font-weight:600; padding:.5rem .95rem; border-radius:4px;
    border:1px solid var(--rule); background:var(--bg); color:var(--fg); cursor:pointer;
  }
  button:hover:not(:disabled){border-color:var(--muted)}
  button:disabled{opacity:.5; cursor:default}
  #go{background:var(--fg); color:var(--bg); border-color:var(--fg)}
  #msg{font-size:.8rem; color:var(--muted)}
  #msg.err{color:var(--bad)}

  iframe{border:0; width:100%; height:100vh; background:var(--bg)}
  @media (max-width:900px){ iframe{height:70vh; border-top:1px solid var(--rule)} }
</style>
</head>
<body>

<div class="panel">
  <h1>{{COUNT}}</h1>
  <p class="sub">{{SOURCE}}</p>
  <ul id="rows">{{ROWS}}</ul>
  <div class="bar">
    <button id="go">Publish</button>
    <button id="back">Roll back</button>
    <span id="msg"></span>
  </div>
</div>

<iframe id="preview" title="Preview"></iframe>

<script nonce="{{NONCE}}">
(function () {
  var TOKEN = "{{TOKEN}}", DIGEST = "{{DIGEST}}";
  var msg = document.getElementById("msg");
  var go = document.getElementById("go");
  var back = document.getElementById("back");
  var frame = document.getElementById("preview");

  function dropped() {
    var out = [];
    document.querySelectorAll('input[name="keep"]').forEach(function (b) {
      if (!b.disabled && !b.checked) out.push(b.value);
    });
    return out;
  }

  function refresh() {
    frame.src = "/preview?t=" + encodeURIComponent(TOKEN) + "&drop=" + dropped().join(",");
  }

  document.getElementById("rows").addEventListener("change", refresh);

  function post(action) {
    go.disabled = back.disabled = true;
    msg.className = "";
    msg.textContent = "working…";
    fetch("/", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action: action, token: TOKEN, digest: DIGEST, drop: dropped()})
    }).then(function (r) { return r.json(); }).then(function (d) {
      msg.textContent = d.message;
      if (!d.ok) { msg.className = "err"; go.disabled = back.disabled = false; }
    }).catch(function (e) {
      msg.className = "err";
      msg.textContent = String(e);
      go.disabled = back.disabled = false;
    });
  }

  go.addEventListener("click", function () { post("publish"); });
  back.addEventListener("click", function () {
    msg.className = "";
    msg.textContent = "click again to confirm rollback";
    back.onclick = function () { post("rollback"); };
  });

  refresh();
})();
</script>
</body>
</html>
