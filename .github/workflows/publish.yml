name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"      # rebuild daily once Hermes is writing items.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: the label is mutable and the image moves under you.
    runs-on: ubuntu-24.04
    steps:
      # Pinned to commit SHAs, not tags. Tags are mutable, and this workflow
      # holds pages:write and id-token:write - a moved tag could publish
      # arbitrary content to the domain. Dependabot keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # No pip install. render.py is standard library only.
      - run: python render.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
