name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"      # rebuild daily once Hermes is writing items.json
  workflow_dispatch:

# contents:read only. The credentials that can publish to the domain live on the
# deploy job alone, so a compromised build step cannot reach them.
permissions:
  contents: read

concurrency:
  group: pages
  # false, per GitHub's Pages guidance: a second push must not kill a production
  # deployment part-way through.
  cancel-in-progress: false

jobs:
  # The gate. render.py's sanitiser is what stands between scraped input and the
  # page, so a failed probe has to stop the publish, not merely report it.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned like everything else in this file. The runner image ships some Node
      # already, but "whatever the image has" is exactly the mutable dependency
      # the SHA pins above exist to avoid.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - run: python tests/audit_check.py
      - run: python tests/sec_check.py
      - run: python tests/publish_check.py
      - run: node --test worker/test/*.test.mjs

  build:
    needs: test
    # Pinned, not ubuntu-latest: the label is mutable and the image moves under you.
    runs-on: ubuntu-24.04
    steps:
      # Pinned to commit SHAs, not tags. Tags are mutable, and a moved tag in the
      # deploy chain could publish arbitrary content to the domain. Dependabot
      # keeps them current.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # No pip install. render.py is standard library only.
      - run: python render.py
        env:
          # Public values only. The Worker keeps the Turnstile secret and Google
          # Form identifiers in Cloudflare's encrypted secret store.
          SUBSCRIBE_ENDPOINT: ${{ vars.SUBSCRIBE_ENDPOINT }}
          TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    # The only job that may publish.
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
